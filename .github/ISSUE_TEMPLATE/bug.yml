name: Bug report
description: Something Spool dispatches, owns, or reports incorrectly.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Spool is **experimental 1.0.x** — the API may change while that status remains.
        Please search [existing issues](https://github.com/relicloops/spool/issues?q=is%3Aissue)
        before filing a duplicate.

        Valve parse bugs belong in [relicloops/valve](https://github.com/relicloops/valve/issues)
        unless the defect is clearly in Spool.

  - type: input
    id: version
    attributes:
      label: Spool version
      description: >-
        From meson.build project version, or the string returned by
        spool_version_get() (1.0.0-000 style).
      placeholder: "1.0.0-000"
    validations:
      required: true

  - type: input
    id: valve-version
    attributes:
      label: Valve version (pinned)
      description: Tag or revision from subprojects/valve.wrap.
      placeholder: "v1.0.0-000"
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature area
      description: Which part of Spool is involved?
      options:
        - Dispatch / ownership
        - Route matching
        - Version helpers
        - Build (Meson) / tests (Ceedling)
        - Docs / packaging
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: Run `uname -srm` (or paste macOS / Linux distro + version).
      placeholder: "Darwin 25.5.0 arm64"
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: Compiler
      description: Run the selected C compiler with `--version`.
      placeholder: "Apple clang version 17.0.0"
    validations:
      required: true

  - type: textarea
    id: routes
    attributes:
      label: Route table (optional)
      description: Minimal `spool_route_t` snippet if the bug depends on routing.
      render: c
      placeholder: |
        static const spool_route_t routes[] = {
            {.verb = "serve", .subverb = nullptr, .run = serve_run},
            {.verb = nullptr},
        };

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
      description: What should happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste compiler errors or Ceedling failure text.
      render: shell
